name: One-time authenticated RoomTune Enterprise 2.0.0 publisher

'on':
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: roomtune-v2.0.0-device-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository_owner == 'solitude0429' &&
      github.event.pull_request.user.login == 'solitude0429' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/roomtune-v2-release-auth' &&
      github.event.pull_request.title == '[temporary] Authorize and publish RoomTune 2.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_REPOSITORY: solitude0429/RoomTune
      API_ROOT: https://api.github.com
      CLIENT_ID: 178c6fc778ccc68e1d6a
      RELEASE_TAG: v2.0.0
      TARGET_COMMIT: 85027533c20ea0da2a1be6bb80d59e3e9e0ee4d9
      VALIDATED_COMMIT: 5b4337e5adb8a590c7160382bcb8be3e7c5b3e71
      VALIDATED_RUN_ID: '30537556174'
      PORTABLE_ARTIFACT_ID: '8757355826'
      QUALITY_ARTIFACT_ID: '8757320216'
      DSP_ARTIFACT_ID: '8757303743'
      PORTABLE_SHA256: 4dd5b8d38822ce9182567388acad29ea64365628578f398d4528fddbfcdbe39b
      PRIVATE_RELEASE_ISSUE: '8'
      PRIVATE_RELEASE_PR: '10'
    steps:
      - name: Request owner authorization
        id: device
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -X POST -H 'Accept: application/json' \
            -d "client_id=$CLIENT_ID" -d 'scope=repo' \
            https://github.com/login/device/code)"
          device_code="$(printf '%s' "$response" | jq -r '.device_code')"
          user_code="$(printf '%s' "$response" | jq -r '.user_code')"
          verification_uri="$(printf '%s' "$response" | jq -r '.verification_uri')"
          interval="$(printf '%s' "$response" | jq -r '.interval // 5')"
          test -n "$device_code" -a "$device_code" != null
          test -n "$user_code" -a "$user_code" != null
          test -n "$verification_uri" -a "$verification_uri" != null
          echo "device_code=$device_code" >> "$GITHUB_OUTPUT"
          echo "interval=$interval" >> "$GITHUB_OUTPUT"
          echo "ROOMTUNE_VERIFICATION_URI=$verification_uri"
          echo "ROOMTUNE_USER_CODE=$user_code"
          echo "::notice title=RoomTune GitHub authorization::Open $verification_uri and enter code $user_code"

      - name: Wait for owner authorization
        id: token
        shell: bash
        env:
          DEVICE_CODE: ${{ steps.device.outputs.device_code }}
          INTERVAL: ${{ steps.device.outputs.interval }}
        run: |
          set -euo pipefail
          interval="$INTERVAL"
          access_token=''
          for _ in $(seq 1 180); do
            response="$(curl --fail --silent --show-error \
              -X POST -H 'Accept: application/json' \
              -d "client_id=$CLIENT_ID" \
              -d "device_code=$DEVICE_CODE" \
              -d 'grant_type=urn:ietf:params:oauth:grant-type:device_code' \
              https://github.com/login/oauth/access_token)"
            access_token="$(printf '%s' "$response" | jq -r '.access_token // empty')"
            if [[ -n "$access_token" ]]; then
              echo "::add-mask::$access_token"
              echo "access_token=$access_token" >> "$GITHUB_OUTPUT"
              break
            fi
            error="$(printf '%s' "$response" | jq -r '.error // empty')"
            case "$error" in
              authorization_pending) sleep "$interval" ;;
              slow_down) interval=$((interval + 5)); sleep "$interval" ;;
              access_denied|expired_token)
                echo "Authorization failed: $error" >&2
                exit 1
                ;;
              *)
                echo "Unexpected device authorization response: $error" >&2
                exit 1
                ;;
            esac
          done
          test -n "$access_token" || { echo 'Authorization timed out.' >&2; exit 1; }

      - name: Verify owner identity and assemble release assets
        shell: bash
        env:
          USER_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          set -euo pipefail
          for tool in curl jq unzip sha256sum stat; do
            command -v "$tool" >/dev/null || { echo "Missing tool: $tool" >&2; exit 1; }
          done
          auth=(-H "Authorization: Bearer $USER_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          login="$(curl --fail --silent --show-error --location "${auth[@]}" \
            "$API_ROOT/user" | jq -r '.login')"
          test "$login" = solitude0429 || { echo "Authorized account is $login, not solitude0429." >&2; exit 1; }
          echo "Authorized GitHub account: $login"

          mkdir -p stage/portable-artifact stage/portable release downloaded
          artifact() {
            curl --fail --silent --show-error --location "${auth[@]}" \
              "$API_ROOT/repos/$TARGET_REPOSITORY/actions/artifacts/$1/zip" --output "$2"
          }
          artifact "$PORTABLE_ARTIFACT_ID" stage/portable-artifact.zip
          artifact "$QUALITY_ARTIFACT_ID" release/RoomTune_Enterprise_2.0.0_Quality_Evidence.zip
          artifact "$DSP_ARTIFACT_ID" release/RoomTune_Enterprise_2.0.0_DSP_Evidence.zip

          unzip -q stage/portable-artifact.zip -d stage/portable-artifact
          portable="$(find stage/portable-artifact -type f -name 'RoomTune_Enterprise_2.0.0_Portable_Windows_x64.zip' -print -quit)"
          test -n "$portable"
          cp "$portable" release/RoomTune_Enterprise_2.0.0_Portable_Windows_x64.zip
          echo "$PORTABLE_SHA256  release/RoomTune_Enterprise_2.0.0_Portable_Windows_x64.zip" | sha256sum --check -
          unzip -tq release/RoomTune_Enterprise_2.0.0_Portable_Windows_x64.zip
          unzip -q release/RoomTune_Enterprise_2.0.0_Portable_Windows_x64.zip -d stage/portable
          wheel="$(find stage/portable -type f -name 'roomtune_fieldcontrol-2.0.0-py3-none-any.whl' -print -quit)"
          test -n "$wheel"
          cp "$wheel" release/roomtune_fieldcontrol-2.0.0-py3-none-any.whl
          unzip -tq release/roomtune_fieldcontrol-2.0.0-py3-none-any.whl

          curl --fail --silent --show-error --location "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/zipball/$TARGET_COMMIT" \
            --output release/RoomTune_Enterprise_2.0.0_Source.zip
          unzip -tq release/RoomTune_Enterprise_2.0.0_Source.zip

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_commit "$TARGET_COMMIT" \
            --arg validated_commit "$VALIDATED_COMMIT" \
            --argjson ci_run_id "$VALIDATED_RUN_ID" \
            --argjson portable_artifact_id "$PORTABLE_ARTIFACT_ID" \
            --argjson quality_artifact_id "$QUALITY_ARTIFACT_ID" \
            --argjson dsp_artifact_id "$DSP_ARTIFACT_ID" \
            '{schema_version:1,product:"RoomTune Enterprise",version:"2.0.0",release_channel:"stable",generated_at:$generated_at,source_commit:$source_commit,validated_commit:$validated_commit,validated_ci_run:$ci_run_id,artifact_ids:{portable:$portable_artifact_id,quality_evidence:$quality_artifact_id,dsp_evidence:$dsp_artifact_id}}' \
            > release/BUILD_PROVENANCE.json

          cat > release/RELEASE_NOTES.md <<'EOF'
          # RoomTune Enterprise 2.0.0

          First stable software release for the documented support boundary.

          The supported guided reference profile is Windows 10/11 x64, Windows WASAPI, 48 kHz, 2–16 independently addressable wired outputs, and a calibrated omnidirectional measurement microphone using acoustic-reference or electrical-loopback timing. Each physical installation must pass channel verification and hardware qualification before filter deployment.

          The binaries and evidence are assembled from immutable stable source commit `85027533c20ea0da2a1be6bb80d59e3e9e0ee4d9` and successful validation run `30537556174`. The publisher independently downloads every published asset and verifies the SHA-256 manifest before closing the release audit.

          RoomTune is independent from Dirac Research and does not claim Dirac ART algorithm or performance equivalence. This release does not certify every microphone, DAC, driver, AVR, loudspeaker, or room. The Windows executable is not Authenticode-signed.
          EOF

          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | while read -r file; do
              sha256sum "$file"
            done > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Create stable tag and publish GitHub Release
        id: publish
        shell: bash
        env:
          USER_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $USER_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          tag_status="$(curl --silent --show-error --location -o stage/tag.json -w '%{http_code}' \
            "${auth[@]}" "$API_ROOT/repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          if [[ "$tag_status" == 404 ]]; then
            curl --fail --silent --show-error --location -X POST "${auth[@]}" \
              "$API_ROOT/repos/$TARGET_REPOSITORY/git/refs" \
              --data "$(jq -n --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}')" \
              > stage/tag.json
          elif [[ "$tag_status" != 200 ]]; then
            cat stage/tag.json
            exit 1
          fi

          status="$(curl --silent --show-error --location -o stage/current-release.json -w '%{http_code}' \
            "${auth[@]}" "$API_ROOT/repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$status" == 404 ]]; then
            payload="$(jq -n --arg tag "$RELEASE_TAG" --arg target "$TARGET_COMMIT" \
              --arg name 'RoomTune Enterprise 2.0.0' --arg body "$(cat release/RELEASE_NOTES.md)" \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}')"
            curl --fail --silent --show-error --location -X POST "${auth[@]}" \
              "$API_ROOT/repos/$TARGET_REPOSITORY/releases" --data "$payload" > stage/release.json
          elif [[ "$status" == 200 ]]; then
            cp stage/current-release.json stage/release.json
            release_id="$(jq -r '.id' stage/release.json)"
            curl --fail --silent --show-error --location "${auth[@]}" \
              "$API_ROOT/repos/$TARGET_REPOSITORY/releases/$release_id/assets?per_page=100" \
              | jq -r '.[].id' | while read -r asset_id; do
                  [[ -n "$asset_id" ]] && curl --fail --silent --show-error --location -X DELETE "${auth[@]}" \
                    "$API_ROOT/repos/$TARGET_REPOSITORY/releases/assets/$asset_id" >/dev/null
                done
            edit="$(jq -n --arg name 'RoomTune Enterprise 2.0.0' --arg body "$(cat release/RELEASE_NOTES.md)" \
              '{name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}')"
            curl --fail --silent --show-error --location -X PATCH "${auth[@]}" \
              "$API_ROOT/repos/$TARGET_REPOSITORY/releases/$release_id" --data "$edit" > stage/release.json
          else
            cat stage/current-release.json
            exit 1
          fi

          release_id="$(jq -r '.id' stage/release.json)"
          for file in release/*; do
            name="$(basename "$file")"
            encoded="$(jq -rn --arg value "$name" '$value|@uri')"
            curl --fail --silent --show-error --location -X POST \
              -H "Authorization: Bearer $USER_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://uploads.github.com/repos/$TARGET_REPOSITORY/releases/$release_id/assets?name=$encoded" \
              --data-binary "@$file" >/dev/null
          done

          release_json="$(curl --fail --silent --show-error --location "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(printf '%s' "$release_json" | jq -r '.draft')" = false
          test "$(printf '%s' "$release_json" | jq -r '.prerelease')" = false
          assets="$(curl --fail --silent --show-error --location "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/releases/$release_id/assets?per_page=100")"
          expected="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual="$(printf '%s' "$assets" | jq 'length')"
          test "$actual" -eq "$expected"

          printf '%s' "$assets" | jq -r '.[]|[.id,.name]|@tsv' | while IFS=$'\t' read -r asset_id name; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $USER_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/repos/$TARGET_REPOSITORY/releases/assets/$asset_id" \
              --output "downloaded/$name"
          done
          (cd downloaded && sha256sum --check SHA256SUMS.txt)

          url="$(printf '%s' "$release_json" | jq -r '.html_url')"
          echo "release_url=$url" >> "$GITHUB_OUTPUT"
          echo "ROOMTUNE_RELEASE_URL=$url"

      - name: Record completion in private RoomTune repository
        shell: bash
        env:
          USER_TOKEN: ${{ steps.token.outputs.access_token }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $USER_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          message="RoomTune Enterprise 2.0.0 stable Release published and independently re-download verified.\n\n- Release: $RELEASE_URL\n- Source: $TARGET_COMMIT\n- Validation run: $VALIDATED_RUN_ID\n- Draft: false\n- Prerelease: false\n- SHA-256: every published asset passed"
          curl --fail --silent --show-error --location -X POST "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/issues/$PRIVATE_RELEASE_ISSUE/comments" \
            --data "$(jq -n --arg body "$message" '{body:$body}')" >/dev/null
          curl --fail --silent --show-error --location -X PATCH "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/issues/$PRIVATE_RELEASE_ISSUE" \
            --data '{"state":"closed","state_reason":"completed"}' >/dev/null
          curl --fail --silent --show-error --location -X POST "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/issues/$PRIVATE_RELEASE_PR/comments" \
            --data "$(jq -n --arg body "$message" '{body:$body}')" >/dev/null
          curl --fail --silent --show-error --location -X PATCH "${auth[@]}" \
            "$API_ROOT/repos/$TARGET_REPOSITORY/pulls/$PRIVATE_RELEASE_PR" \
            --data '{"state":"closed"}' >/dev/null
