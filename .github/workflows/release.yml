name: GitHub Release Assets

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify tag and all release metadata versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.js
      - run: npm run verify
      - name: Create sorted release checksums
        run: |
          (cd dist && sha256sum open-video-catcher-chrome-edge.zip open-video-catcher-firefox.zip | sort -k2 > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/open-video-catcher-chrome-edge.zip
            dist/open-video-catcher-firefox.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: assets
      - run: (cd assets && sha256sum -c SHA256SUMS)
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: assets/SHA256SUMS

  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: assets
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd assets && sha256sum -c SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate it: $RELEASE_TAG" >&2
            exit 1
          fi
          printf '%s\n' \
            '## Open Video Catcher' \
            '' \
            '- Chrome/Edge unsigned development ZIP' \
            '- Firefox unsigned development ZIP' \
            '- SHA256SUMS and GitHub artifact attestation' > release-notes.md
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            assets/open-video-catcher-chrome-edge.zip \
            assets/open-video-catcher-firefox.zip \
            assets/SHA256SUMS
